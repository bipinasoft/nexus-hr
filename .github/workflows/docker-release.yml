name: Docker Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.nexushr.example.com
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexus-hr-web:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/python-service.Dockerfile
          build-args: |
            SERVICE_PATH=backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nexus-hr-backend:latest
