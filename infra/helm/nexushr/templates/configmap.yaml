apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexushr.fullname" . }}-config
data:
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.platform.publicApiUrl | quote }}
  NEXUSHR_SERVICE_NAME: "backend-service"
  NEXUSHR_AUTH_MODE: {{ .Values.backend.env.authMode | quote }}
  NEXUSHR_JWT_ISSUER: {{ .Values.backend.env.jwtIssuer | quote }}
  NEXUSHR_OIDC_AUDIENCE: {{ .Values.backend.env.oidcAudience | quote }}
  NEXUSHR_CORS_ORIGINS: {{ .Values.backend.env.corsOrigins | quote }}
  NEXUSHR_BOOTSTRAP_DATABASE: {{ .Values.backend.env.bootstrapDatabase | quote }}
  NEXUSHR_SEED_DEMO_DATA: {{ .Values.backend.env.seedDemoData | quote }}
  NEXUSHR_VECTOR_DIMENSIONS: {{ .Values.backend.env.vectorDimensions | quote }}
  NEXUSHR_LOCAL_LLM_BASE_URL: {{ .Values.backend.env.localLlmBaseUrl | quote }}
  NEXUSHR_LOCAL_LLM_MODEL: {{ .Values.backend.env.localLlmModel | quote }}
