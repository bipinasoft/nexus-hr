apiVersion: v1
kind: Namespace
metadata:
  name: nexushr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexushr-config
  namespace: nexushr
data:
  NEXUSHR_OIDC_ISSUER_URL: "https://login.nexushr.example.com/realms/nexushr"
  NEXUSHR_OIDC_JWKS_URL: "https://login.nexushr.example.com/realms/nexushr/protocol/openid-connect/certs"
  NEXUSHR_OIDC_AUDIENCE: "nexushr-api"
  NEXUSHR_MONGODB_AUDIT_URI: "mongodb://mongo-router.platform.svc.cluster.local:27017"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexushr-secrets
  namespace: nexushr
type: Opaque
stringData:
  DATABASE_URL: "REPLACE_WITH_MANAGED_POSTGRES_URL"
  REDIS_URL: "redis://REPLACE_WITH_MANAGED_REDIS:6379/0"
  S3_BUCKET: "nexushr-documents"
  S3_REGION: "ap-south-1"
  S3_KMS_KEY_ID: "REPLACE_WITH_KMS_KEY_ID"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: nexushr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/nexushr-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nexushr
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nexushr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/nexushr-auth-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexushr-config
            - secretRef:
                name: nexushr-secrets
          env:
            - name: NEXUSHR_SERVICE_NAME
              value: "auth-service"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: nexushr
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
