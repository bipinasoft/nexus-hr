apiVersion: v1
kind: Namespace
metadata:
  name: nexushr
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexushr-config
  namespace: nexushr
data:
  NEXT_PUBLIC_API_BASE_URL: "https://api.nexushr.example.com"
  NEXUSHR_SERVICE_NAME: "backend-service"
  NEXUSHR_AUTH_MODE: "hybrid"
  NEXUSHR_JWT_ISSUER: "https://api.nexushr.example.com/auth"
  NEXUSHR_OIDC_ISSUER_URL: "https://login.nexushr.example.com/realms/nexushr"
  NEXUSHR_OIDC_JWKS_URL: "https://login.nexushr.example.com/realms/nexushr/protocol/openid-connect/certs"
  NEXUSHR_OIDC_AUDIENCE: "nexushr-api"
  NEXUSHR_CORS_ORIGINS: "https://nexushr.example.com,https://api.nexushr.example.com"
  NEXUSHR_BOOTSTRAP_DATABASE: "false"
  NEXUSHR_SEED_DEMO_DATA: "false"
  NEXUSHR_VECTOR_DIMENSIONS: "256"
  NEXUSHR_LOCAL_LLM_BASE_URL: "http://ollama.default.svc.cluster.local:11434/v1"
  NEXUSHR_LOCAL_LLM_MODEL: "llama3.1"
---
apiVersion: v1
kind: Secret
metadata:
  name: nexushr-secrets
  namespace: nexushr
type: Opaque
stringData:
  NEXUSHR_JWT_SECRET: "REPLACE_WITH_A_LONG_RANDOM_SECRET"
  NEXUSHR_DATABASE_URL: "postgresql+asyncpg://nexushr:nexushr@postgres.default.svc.cluster.local:5432/nexushr"
  NEXUSHR_REDIS_URL: "redis://redis.default.svc.cluster.local:6379/0"
  NEXUSHR_MONGODB_AUDIT_URI: "mongodb://mongo.default.svc.cluster.local:27017"
  NEXUSHR_OPENAI_API_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: nexushr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/nexushr-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: nexushr-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: nexushr
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: nexushr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/nexushr-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nexushr-config
            - secretRef:
                name: nexushr-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexushr
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexushr
  namespace: nexushr
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - nexushr.example.com
        - api.nexushr.example.com
      secretName: nexushr-tls
  rules:
    - host: nexushr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: api.nexushr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
