---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexushr-web
  namespace: nexushr
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - app.nexushr.example.com
      secretName: nexushr-web-tls
  rules:
    - host: app.nexushr.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
